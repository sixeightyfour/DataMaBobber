name: Update Data

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dataset
        run: python -u scripts/build_dataset.py

      - name: Build lightweight author/date dataset
        run: python scripts/build_article_author_dates.py

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/scp_articles.json docs/data/article_author_dates.json

          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Update SCP dataset"
            git push
          fi
