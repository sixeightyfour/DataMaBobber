<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SCP Articles per User - Last 30 Days</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px;
      line-height: 1.4;
    }

    nav {
      margin-bottom: 16px;
    }

    a {
      color: #0645ad;
    }

    #chart {
      width: 100%;
      height: 750px;
    }

    #stats {
      margin-top: 12px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <nav>
    <a href="../">Back to graph builder</a>
  </nav>

  <h1 id="pageTitle">Articles per user between ...</h1>

  <div id="chart"></div>
  <div id="stats">Loading dataset...</div>

  <script>
    const DATASET_PATH = "../data/scp_articles.json";
    const WINDOW_DAYS = 30;

    function utcDateOnly(date) {
      return new Date(Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        date.getUTCDate()
      ));
    }

    function formatDate(date) {
      return date.toISOString().slice(0, 10);
    }

    function articleDate(article) {
      return new Date(article.createdAt);
    }

    function getPosterName(article) {
      if (article.poster) {
        return article.poster.name || article.poster.unixName || "Unknown user";
      }

      return "Unknown user";
    }

    function buildUserArticleCounts(articles, startDate, endDate) {
      const counts = new Map();

      for (const article of articles) {
        const created = articleDate(article);

        if (created < startDate || created > endDate) {
          continue;
        }

        const posterName = getPosterName(article);

        counts.set(
          posterName,
          (counts.get(posterName) || 0) + 1
        );
      }

      return [...counts.entries()]
        .map(([user, count]) => ({ user, count }))
        .sort((a, b) => {
          if (b.count !== a.count) return b.count - a.count;
          return a.user.localeCompare(b.user);
        });
    }

    function renderHistogram(userCounts, startDate, endDate, generatedAt) {
      const title = `Articles per user between ${formatDate(startDate)} - ${formatDate(endDate)}`;

      document.getElementById("pageTitle").textContent = title;

      if (userCounts.length === 0) {
        Plotly.newPlot("chart", [], {
          title,
          xaxis: { title: "Articles posted by a user in the period" },
          yaxis: { title: "Number of users" },
        }, { responsive: true });

        document.getElementById("stats").textContent =
          `Dataset generated at: ${generatedAt || "unknown"}` +
          `\nUsers found: 0` +
          `\nArticles in period: 0`;

        return;
      }

      const values = userCounts.map(row => row.count);

      Plotly.newPlot("chart", [{
        type: "histogram",
        x: values,
        xbins: {
          start: 1,
          size: 1,
        },
        name: "Users",
      }], {
        title,
        bargap: 0.05,
        xaxis: {
          title: "Articles posted by a user in the period",
          dtick: 1,
        },
        yaxis: {
          title: "Number of users",
        },
      }, { responsive: true });

      const totalUsers = userCounts.length;
      const totalArticles = values.reduce((a, b) => a + b, 0);
      const maxArticles = Math.max(...values);
      const topUsers = userCounts
        .slice(0, 15)
        .map(row => `${row.user}: ${row.count}`)
        .join("\n");

      document.getElementById("stats").textContent =
        `Dataset generated at: ${generatedAt || "unknown"}` +
        `\nUsers with at least one article in period: ${totalUsers}` +
        `\nArticles in period: ${totalArticles}` +
        `\nMost articles by one user: ${maxArticles}` +
        `\n\nTop users:\n${topUsers}`;
    }

    async function main() {
      const response = await fetch(DATASET_PATH);

      if (!response.ok) {
        throw new Error(`Failed to load dataset: ${response.status}`);
      }

      const dataset = await response.json();

      const today = utcDateOnly(new Date());
      const startDate = new Date(today);
      startDate.setUTCDate(startDate.getUTCDate() - WINDOW_DAYS);

      const articles = dataset.articles || [];
      const userCounts = buildUserArticleCounts(articles, startDate, today);

      renderHistogram(userCounts, startDate, today, dataset.generatedAt);
    }

    main().catch(error => {
      document.getElementById("stats").textContent = String(error);
      console.error(error);
    });
  </script>
</body>
</html>
